<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI卡租金追踪 — GPU 租赁价格监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --accent: #6366f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
        }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .header-right {
            display: flex; align-items: center; gap: 16px;
            font-size: 13px; color: var(--text-secondary);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px;
        }
        .status-dot.ok { background: var(--green); }
        .status-dot.warn { background: #f59e0b; }
        .status-dot.err { background: var(--red); }

        /* GPU Tabs */
        .tabs {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;
        }
        .tab {
            padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-secondary); cursor: pointer;
            font-size: 14px; transition: all 0.2s; user-select: none;
        }
        .tab:hover { border-color: var(--accent); color: var(--text); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Stat Cards */
        .stat-cards {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 18px; cursor: pointer; transition: border-color 0.2s;
        }
        .stat-card:hover { border-color: var(--accent); }
        .stat-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .stat-card .gpu-name { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .stat-card .price { font-size: 28px; font-weight: 800; color: var(--text); }
        .stat-card .change {
            font-size: 13px; margin-top: 4px; font-weight: 600;
        }
        .stat-card .change.up { color: var(--red); }
        .stat-card .change.down { color: var(--green); }
        .stat-card .change.flat { color: var(--text-secondary); }
        .stat-card .provider { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .stat-card .no-data { font-size: 14px; color: var(--text-secondary); }

        /* Charts Grid */
        .charts-grid {
            display: grid; grid-template-columns: 2fr 1fr;
            gap: 20px; margin-bottom: 24px;
        }
        .chart-panel {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
        }
        .chart-panel.full { grid-column: 1 / -1; }
        .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .chart-box { width: 100%; height: 400px; }
        .chart-box.short { height: 350px; }
        .chart-box.tall { height: 300px; }

        /* Data Table */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        th, td {
            padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--card-bg); color: var(--text-secondary); font-weight: 600;
            position: sticky; top: 0; cursor: pointer; user-select: none;
        }
        th:hover { color: var(--text); }
        tr:hover td { background: rgba(99, 102, 241, 0.05); }
        .price-cell { font-weight: 600; font-variant-numeric: tabular-nums; }
        .tier-badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600;
        }
        .tier-badge.spot { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .tier-badge.secure { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .tier-badge.community { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .tier-badge.on-demand { background: rgba(99, 102, 241, 0.2); color: #c4b5fd; }

        /* Controls */
        .controls {
            display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
        }
        .controls input, .controls select {
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 13px;
        }
        .controls input:focus, .controls select:focus {
            outline: none; border-color: var(--accent);
        }
        .btn {
            padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); cursor: pointer;
            font-size: 13px; transition: all 0.2s;
        }
        .btn:hover { border-color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Footer */
        .footer {
            text-align: center; padding: 20px; color: var(--text-secondary);
            font-size: 12px; border-top: 1px solid var(--border); margin-top: 32px;
        }
        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; margin-bottom: 8px; }

        @media (max-width: 900px) {
            .charts-grid { grid-template-columns: 1fr; }
            .stat-cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div>
            <h1>🖥️ AI卡租金追踪</h1>
            <div class="subtitle">GPU 云租赁价格监控 · 数据每日自动更新 · 来源: Vast.ai & RunPod</div>
        </div>
        <div class="header-right">
            <span><span class="status-dot" id="statusDot"></span>数据更新于 <strong id="lastUpdate">--</strong></span>
            <span>数据跨度 <strong id="dateSpan">--</strong> 天</span>
            <button class="btn primary" onclick="location.reload()">刷新数据</button>
        </div>
    </div>

    <!-- GPU Tabs -->
    <div class="tabs" id="gpuTabs">
        <div class="tab active" data-gpu="">全部</div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-cards" id="statCards"></div>

    <!-- Charts -->
    <div class="charts-grid">
        <div class="chart-panel">
            <div class="chart-title">📈 价格趋势</div>
            <div class="chart-box" id="chartTrend"></div>
        </div>
        <div class="chart-panel">
            <div class="chart-title">📊 平台对比（最新）</div>
            <div class="chart-box short" id="chartProvider"></div>
        </div>
        <div class="chart-panel full">
            <div class="chart-title">📦 价格分布（箱线图）</div>
            <div class="chart-box tall" id="chartBox"></div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="chart-panel full">
        <div class="chart-title">📋 数据明细</div>
        <div class="controls">
            <input type="text" id="tableSearch" placeholder="搜索 GPU / 平台..." oninput="renderTable()">
            <select id="tableTier" onchange="renderTable()">
                <option value="">所有层级</option>
                <option value="on-demand">on-demand</option>
                <option value="spot">spot</option>
                <option value="secure">secure</option>
                <option value="community">community</option>
            </select>
            <button class="btn" onclick="exportCSV()">⬇ 导出 CSV</button>
        </div>
        <div class="table-wrapper">
            <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
        </div>
    </div>

    <div class="footer">
        GPU 价格追踪器 · 数据来源: Vast.ai & RunPod · 仅供参考 · <span id="footerUpdate"></span>
    </div>
</div>

<script>
// ===== State =====
let allLatestData = [];
let allDailyData = [];
let allStats = {};
let selectedGPU = '';
let trendsChart, providerChart, boxChart;

// ===== Init =====
async function init() {
    await Promise.all([
        fetchLatest(),
        fetchDaily(),
        fetchStats(),
        fetchDateRange(),
        fetchSources(),
        fetchGPUList(),
    ]);
    renderAll();
}

// ===== API calls =====
async function fetchLatest() {
    try {
        const r = await fetch('/api/prices/latest');
        allLatestData = await r.json();
    } catch(e) { console.error(e); }
}

async function fetchDaily() {
    try {
        const r = await fetch('/api/prices/daily');
        allDailyData = await r.json();
    } catch(e) { console.error(e); }
}

async function fetchStats() {
    try {
        const r = await fetch('/api/stats');
        allStats = await r.json();
    } catch(e) { console.error(e); }
}

async function fetchDateRange() {
    try {
        const r = await fetch('/api/daterange');
        const dr = await r.json();
        document.getElementById('lastUpdate').textContent = dr.max_date || '--';
        document.getElementById('dateSpan').textContent = dr.days || 0;
        document.getElementById('footerUpdate').textContent = '最后更新: ' + (dr.max_date || '暂无数据');
    } catch(e) {}
}

async function fetchSources() {
    try {
        const r = await fetch('/api/sources/status');
        const statuses = await r.json();
        const dot = document.getElementById('statusDot');
        if (statuses.length === 0) {
            dot.className = 'status-dot err';
        } else if (statuses.every(s => s.status === 'success')) {
            dot.className = 'status-dot ok';
        } else if (statuses.some(s => s.status === 'success')) {
            dot.className = 'status-dot warn';
        } else {
            dot.className = 'status-dot err';
        }
    } catch(e) {}
}

async function fetchGPUList() {
    try {
        const r = await fetch('/api/gpus');
        const gpus = await r.json();
        const tabs = document.getElementById('gpuTabs');
        tabs.innerHTML = '<div class="tab active" data-gpu="">全部</div>';
        gpus.forEach(g => {
            const el = document.createElement('div');
            el.className = 'tab';
            el.dataset.gpu = g;
            el.textContent = g;
            el.onclick = () => selectGPU(g, el);
            tabs.appendChild(el);
        });
    } catch(e) {}
}

// ===== GPU Selection =====
function selectGPU(gpu, el) {
    selectedGPU = gpu;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderAll();
}

// ===== Render All =====
function renderAll() {
    renderStatCards();
    renderTrendChart();
    renderProviderChart();
    renderBoxChart();
    renderTable();
}

// ===== Stat Cards =====
function renderStatCards() {
    const container = document.getElementById('statCards');
    const gpus = selectedGPU ? [selectedGPU] : Object.keys(allStats);

    if (gpus.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>暂无数据，请先运行抓取: <code>python main.py scrape</code></p></div>';
        return;
    }

    container.innerHTML = gpus.map(gpu => {
        const s = allStats[gpu];
        if (!s) return '';
        let changeHtml = '';
        let changeClass = 'flat';
        if (s.change_7d_pct !== null) {
            if (s.change_7d_pct > 0) { changeClass = 'up'; changeHtml = `↑${s.change_7d_pct}% 7d`; }
            else if (s.change_7d_pct < 0) { changeClass = 'down'; changeHtml = `↓${Math.abs(s.change_7d_pct)}% 7d`; }
            else { changeHtml = `→0% 7d`; }
        } else {
            changeHtml = '—';
        }
        const selClass = selectedGPU === gpu ? ' selected' : '';
        return `
            <div class="stat-card${selClass}" onclick="quickSelectGPU('${gpu}')">
                <div class="gpu-name">${gpu}</div>
                <div class="price">$${s.latest_price.toFixed(2)}<span style="font-size:14px;color:#94a3b8">/hr</span></div>
                <div class="change ${changeClass}">${changeHtml}</div>
                <div class="provider">${s.latest_provider || ''}</div>
            </div>`;
    }).join('');
}

function quickSelectGPU(gpu) {
    selectedGPU = gpu;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const tab = document.querySelector(`.tab[data-gpu="${gpu}"]`);
    if (tab) tab.classList.add('active');
    else document.querySelector('.tab[data-gpu=""]').classList.add('active');
    renderAll();
}

// ===== Trend Chart =====
function renderTrendChart() {
    const dom = document.getElementById('chartTrend');
    if (!trendsChart) trendsChart = echarts.init(dom);

    // Group by GPU
    const byGPU = {};
    allDailyData.forEach(d => {
        if (selectedGPU && d.gpu_model !== selectedGPU) return;
        if (!byGPU[d.gpu_model]) byGPU[d.gpu_model] = {};
        byGPU[d.gpu_model][d.scrape_date] = d.price_per_hour;
    });

    const gpuNames = Object.keys(byGPU).sort();
    // Collect all dates
    const dateSet = new Set();
    Object.values(byGPU).forEach(dp => Object.keys(dp).forEach(d => dateSet.add(d)));
    const dates = [...dateSet].sort();

    const colors = ['#6366f1','#22c55e','#f59e0b','#ef4444','#3b82f6','#ec4899','#14b8a6','#f97316'];

    const series = gpuNames.map((gpu, i) => ({
        name: gpu,
        type: 'line',
        data: dates.map(d => byGPU[gpu][d] ?? null),
        smooth: true,
        symbol: 'circle',
        symbolSize: 4,
        lineStyle: { width: 2 },
        color: colors[i % colors.length],
        emphasis: { focus: 'series' },
    }));

    const option = {
        tooltip: {
            trigger: 'axis',
            valueFormatter: v => v == null ? '—' : '$' + v.toFixed(4) + '/hr',
        },
        legend: {
            top: 0, right: 0, textStyle: { color: '#94a3b8', fontSize: 12 },
        },
        grid: { left: 60, right: 30, top: 40, bottom: 60 },
        xAxis: {
            type: 'category', data: dates,
            axisLine: { lineStyle: { color: '#334155' } },
            axisLabel: { color: '#64748b', fontSize: 11, rotate: 30 },
        },
        yAxis: {
            type: 'value',
            axisLabel: { color: '#64748b', formatter: '$' + '{value}' },
            splitLine: { lineStyle: { color: '#1e293b' } },
        },
        dataZoom: [
            { type: 'slider', start: 0, end: 100, height: 24, bottom: 8,
              textStyle: { color: '#94a3b8' }, fillerColor: 'rgba(99,102,241,0.1)' },
            { type: 'inside' },
        ],
        series,
    };
    trendsChart.setOption(option, true);
}

// ===== Provider Chart =====
function renderProviderChart() {
    const dom = document.getElementById('chartProvider');
    if (!providerChart) providerChart = echarts.init(dom);

    const latest = allLatestData.filter(d => !selectedGPU || d.gpu_model === selectedGPU);

    // Aggregate by GPU + provider: get cheapest per combination
    const agg = {};
    latest.forEach(d => {
        const key = `${d.gpu_model}|${d.provider}`;
        if (!agg[key] || d.price_per_hour < agg[key].price) {
            agg[key] = { gpu: d.gpu_model, provider: d.provider, price: d.price_per_hour };
        }
    });

    const providers = [...new Set(Object.values(agg).map(a => a.provider))].sort();
    const gpus = [...new Set(Object.values(agg).map(a => a.gpu))].sort();
    const colors = ['#6366f1','#22c55e','#f59e0b','#ef4444','#3b82f6'];

    const series = providers.map((prov, i) => ({
        name: prov,
        type: 'bar',
        data: gpus.map(g => {
            const entry = Object.values(agg).find(a => a.gpu === g && a.provider === prov);
            return entry ? entry.price : null;
        }),
        color: colors[i % colors.length],
        emphasis: { focus: 'series' },
    }));

    const option = {
        tooltip: {
            trigger: 'axis',
            valueFormatter: v => v == null ? '—' : '$' + v.toFixed(4) + '/hr',
        },
        legend: {
            top: 0, textStyle: { color: '#94a3b8', fontSize: 12 },
        },
        grid: { left: 60, right: 20, top: 40, bottom: 50 },
        xAxis: {
            type: 'category', data: gpus,
            axisLabel: { color: '#94a3b8', fontSize: 12 },
            axisLine: { lineStyle: { color: '#334155' } },
        },
        yAxis: {
            type: 'value',
            axisLabel: { color: '#64748b', formatter: '$' + '{value}' },
            splitLine: { lineStyle: { color: '#1e293b' } },
        },
        series,
    };
    providerChart.setOption(option, true);
}

// ===== Box Plot =====
function renderBoxChart() {
    const dom = document.getElementById('chartBox');
    if (!boxChart) boxChart = echarts.init(dom);

    const data = allLatestData.filter(d => !selectedGPU || d.gpu_model === selectedGPU);

    // Compute box plot data per GPU
    const byGPU = {};
    data.forEach(d => {
        if (!byGPU[d.gpu_model]) byGPU[d.gpu_model] = [];
        byGPU[d.gpu_model].push(d.price_per_hour);
    });

    const gpus = Object.keys(byGPU).sort();
    const boxData = gpus.map(gpu => {
        const prices = byGPU[gpu].sort((a,b) => a - b);
        const n = prices.length;
        if (n === 0) return [0,0,0,0,0];
        const min = prices[0];
        const max = prices[n-1];
        const q1 = prices[Math.floor(n/4)];
        const median = prices[Math.floor(n/2)];
        const q3 = prices[Math.floor(3*n/4)];
        return [min, q1, median, q3, max];
    });

    const option = {
        tooltip: {
            trigger: 'item',
            valueFormatter: v => '$' + (Array.isArray(v) ? v[2]?.toFixed(4) : v?.toFixed(4)) + '/hr',
        },
        grid: { left: 60, right: 20, top: 20, bottom: 40 },
        xAxis: {
            type: 'category', data: gpus,
            axisLabel: { color: '#94a3b8' },
            axisLine: { lineStyle: { color: '#334155' } },
        },
        yAxis: {
            type: 'value',
            axisLabel: { color: '#64748b', formatter: '$' + '{value}' },
            splitLine: { lineStyle: { color: '#1e293b' } },
        },
        series: [{
            type: 'boxplot',
            data: boxData,
            itemStyle: { color: '#6366f1', borderColor: '#818cf8' },
            boxWidth: [10, 30],
        }],
    };
    boxChart.setOption(option, true);
}

// ===== Data Table =====
let sortCol = -1, sortAsc = true;
function renderTable() {
    const search = (document.getElementById('tableSearch').value || '').toLowerCase();
    const tierFilter = document.getElementById('tableTier').value;

    let rows = allLatestData.filter(d => {
        if (selectedGPU && d.gpu_model !== selectedGPU) return false;
        if (tierFilter && d.tier !== tierFilter) return false;
        if (search) {
            const line = (d.gpu_model + d.gpu_submodel + d.provider + d.tier + d.location).toLowerCase();
            if (!line.includes(search)) return false;
        }
        return true;
    });

    // Sort
    if (sortCol >= 0) {
        const cols = ['scrape_date','gpu_model','gpu_submodel','provider','tier','price_per_hour','vram_gb','location'];
        const key = cols[sortCol];
        rows.sort((a,b) => {
            let va = a[key] ?? '', vb = b[key] ?? '';
            if (typeof va === 'number') return sortAsc ? va - vb : vb - va;
            return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
        });
    } else {
        rows.sort((a,b) => (b.price_per_hour||0) - (a.price_per_hour||0));
    }

    const tierClass = t => {
        if (!t) return 'on-demand';
        if (t.includes('spot') || t.includes('interrupt')) return 'spot';
        if (t.includes('secure')) return 'secure';
        if (t.includes('community')) return 'community';
        if (t.includes('verified')) return 'secure';
        return 'on-demand';
    };

    document.getElementById('tableHead').innerHTML = `
        <tr>
            <th onclick="toggleSort(0)">日期</th>
            <th onclick="toggleSort(1)">GPU</th>
            <th onclick="toggleSort(2)">子型号</th>
            <th onclick="toggleSort(3)">平台</th>
            <th onclick="toggleSort(4)">层级</th>
            <th onclick="toggleSort(5)">价格/hr</th>
            <th onclick="toggleSort(6)">显存(GB)</th>
            <th onclick="toggleSort(7)">地区</th>
        </tr>`;

    document.getElementById('tableBody').innerHTML = rows.slice(0, 200).map(r => `
        <tr>
            <td>${r.scrape_date || ''}</td>
            <td><strong>${r.gpu_model || ''}</strong></td>
            <td>${r.gpu_submodel || ''}</td>
            <td>${r.provider || ''}</td>
            <td><span class="tier-badge ${tierClass(r.tier)}">${r.tier || 'on-demand'}</span></td>
            <td class="price-cell">$${(r.price_per_hour || 0).toFixed(4)}</td>
            <td>${r.vram_gb ?? '—'}</td>
            <td>${r.location || '—'}</td>
        </tr>`).join('') || '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:30px;">无匹配数据</td></tr>';
}

function toggleSort(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderTable();
}

function exportCSV() {
    const gpu = selectedGPU || '';
    window.open(`/api/export/csv?gpu=${encodeURIComponent(gpu)}`, '_blank');
}

// ===== Resize =====
window.addEventListener('resize', () => {
    trendsChart?.resize();
    providerChart?.resize();
    boxChart?.resize();
});

// ===== Start =====
init();
</script>
</body>
</html>
